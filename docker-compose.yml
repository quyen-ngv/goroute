services:
  vocaberry-db:
    image: postgres:15-alpine
    container_name: vocaberry-db
    restart: always
    environment:
      POSTGRES_DB: vocaberry_db
      POSTGRES_USER: vocaberry
      POSTGRES_PASSWORD: ${VOCABERRY_DB_PASSWORD:?set VOCABERRY_DB_PASSWORD in the deploy .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vocaberry_db_data:/var/lib/postgresql/data
    networks:
      - vocaberry-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocaberry -d vocaberry_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # GoRoute Database (separate from vocaberry)
  goroute-db:
    image: postgres:15-alpine
    container_name: goroute-db
    restart: always
    environment:
      POSTGRES_DB: goroute
      POSTGRES_USER: goroute
      POSTGRES_PASSWORD: ${GOROUTE_DB_PASSWORD:?set GOROUTE_DB_PASSWORD in the deploy .env}
    ports:
      - "127.0.0.1:5433:5432"  # Different port to avoid conflict
    volumes:
      - goroute_db_data:/var/lib/postgresql/data
    networks:
      - vocaberry-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goroute -d goroute"]
      interval: 10s
      timeout: 5s
      retries: 5

  vocaberry-app:
    image: luxofons/vocaberry:0.0.94
    container_name: vocaberry-app
    restart: always
    user: "0:0"
    expose:
      - "8080"
    env_file:
      - .env
    volumes:
      - vocaberry_lucene_data:/app/data
      - ./data:/app/data
      - ./cookies.txt:/app/cookies.txt
      - ./credentials.json:/app/credentials.json:ro
    depends_on:
      vocaberry-db:
        condition: service_healthy
    networks:
      - vocaberry-network

  # MinIO Storage
  minio:
    image: minio/minio:latest
    container_name: vocaberry-minio
    restart: always
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in the deploy .env}
    expose:
      - "9000"
      - "9001"
    networks:
      - vocaberry-network
    command: server /data --console-address ":9001"

  # GoRoute App
  goroute-app:
    image: luxofons/goroute:v0.0.1
    container_name: goroute-app
    restart: always
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://goroute-db:5432/goroute
      # Unset -> our code logs at DEBUG. Set LOG_LEVEL=ERROR for errors only.
      - LOG_LEVEL=${GOROUTE_LOG_LEVEL:-ERROR}
      - DB_USERNAME=goroute
      - DB_PASSWORD=${GOROUTE_DB_PASSWORD:?set GOROUTE_DB_PASSWORD in the deploy .env}
      - JWT_SECRET=${GOROUTE_JWT_SECRET:?set GOROUTE_JWT_SECRET in the deploy .env}
      - GOROUTE_API_KEY=${GOROUTE_API_KEY:-}
      - FIREBASE_CREDENTIAL_PATH=/app/goroute-credentials.json
      - GOROUTE_AWS_ACCESS_KEY_ID=${GOROUTE_AWS_ACCESS_KEY_ID:-admin}
      - GOROUTE_AWS_SECRET_ACCESS_KEY=${GOROUTE_AWS_SECRET_ACCESS_KEY:?set GOROUTE_AWS_SECRET_ACCESS_KEY in the deploy .env}
      - GOROUTE_AWS_REGION=us-east-1
      - GOROUTE_AWS_S3_BUCKET_NAME=vietdetour
      - GOROUTE_AWS_ENDPOINT=http://minio:9000
      - GOROUTE_AWS_CLOUDFRONT_DOMAIN=onestudy.id.vn/resource
    # goroute-app-healthcheck: a hung app (see the 2026-09-02 AI-trip deadlock) used to look
    # perfectly fine because nothing ever probed it. This marks it unhealthy so 
    # and any monitoring can see it. Note that neither Docker nor Compose restarts an
    # unhealthy container by itself - restart: always only reacts to the process exiting -
    # so acting on it still needs an orchestrator or a watchdog.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    volumes:
      # The prod logback profile writes a rolling file under /app/logs. Without this mount it
      # lives in the container writable layer and is lost on every redeploy.
      - ./logs/goroute:/app/logs
      - ./goroute-credentials.json:/app/goroute-credentials.json:ro
    depends_on:
      goroute-db:
        condition: service_healthy
    networks:
      - vocaberry-network

##  pronunciation-service:
##    image: luxofons/ai-pronun:v1.2
##    container_name: pronunciation-service
##    restart: always
##    expose:
##      - "3000"
##    networks:
##      - vocaberry-network

  cambridge-dictionary:
    image: luxofons/dict:v0.0.4
    container_name: cambridge-dictionary-api
    restart: always
    expose:
      - "3006"
    environment:
      - PORT=3005
      - NODE_ENV=production
    networks:
      - vocaberry-network

  nginx:
    image: nginx:alpine
    container_name: vocaberry-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - vocaberry-app
    networks:
      - vocaberry-network
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    container_name: vocaberry-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  vocaberry_db_data:
  vocaberry_lucene_data:
  goroute_db_data:
  minio_data:

networks:
  vocaberry-network:
    driver: bridge
